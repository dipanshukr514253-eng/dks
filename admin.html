<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel - Control Setup</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
<style>
    body {
        font-family: 'Poppins', sans-serif;
        background: #f4f7f6;
        margin: 0;
        padding: 20px;
    }
    .admin-container {
        max-width: 600px;
        margin: 0 auto;
        background: white;
        padding: 30px;
        border-radius: 15px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }
    h2 {
        text-align: center;
        color: #333;
        margin-top: 0;
    }
    .stats-box {
        background: #2563eb;
        color: white;
        text-align: center;
        padding: 15px;
        border-radius: 10px;
        margin-bottom: 25px;
        font-size: 18px;
        font-weight: bold;
    }
    .form-group {
        margin-bottom: 20px;
    }
    label {
        display: block;
        font-weight: 600;
        margin-bottom: 8px;
        color: #555;
    }
    input[type="text"], input[type="number"], textarea {
        width: 100%;
        padding: 12px;
        border: 1px solid #ccc;
        border-radius: 8px;
        font-family: 'Poppins', sans-serif;
        font-size: 14px;
        box-sizing: border-box;
    }
    textarea {
        height: 120px;
        resize: vertical;
    }
    .btn {
        background: #25D366;
        color: white;
        border: none;
        padding: 15px;
        width: 100%;
        font-size: 16px;
        font-weight: bold;
        border-radius: 8px;
        cursor: pointer;
        transition: 0.3s;
    }
    .btn:hover {
        background: #1ebc59;
    }
    .hint {
        font-size: 12px;
        color: #888;
        margin-top: 5px;
        display: block;
    }
</style>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getFirestore, getDoc, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDHX0dZ5Jfk2mJA1vBXF1YRq8c3Ntjnwz4",
  authDomain: "raushan-a5d9f.firebaseapp.com",
  projectId: "raushan-a5d9f"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// Load Data on startup
async function loadData() {
    try {
        // Load Config
        const configSnap = await getDoc(doc(db, "config", "main"));
        if (configSnap.exists()) {
            let data = configSnap.data();
            document.getElementById('telegramLink').value = data.telegram || "";
            document.getElementById('whatsappNumbers').value = data.numbers || "";
            document.getElementById('whatsappMessage').value = data.message || "";
            document.getElementById('tgRate').value = data.tgRate || 3;
        }

        // Load Stats
        const statsSnap = await getDoc(doc(db, "stats", "clicks"));
        if (statsSnap.exists()) {
            document.getElementById('totalClicks').innerText = statsSnap.data().total || 0;
        }
    } catch(e) {
        alert("Error loading data: " + e.message);
    }
}

// Save Data
window.saveData = async function() {
    let btn = document.getElementById('saveBtn');
    btn.innerText = "Saving...";

    let data = {
        telegram: document.getElementById('telegramLink').value,
        numbers: document.getElementById('whatsappNumbers').value,
        message: document.getElementById('whatsappMessage').value,
        tgRate: parseInt(document.getElementById('tgRate').value) || 3
    };

    try {
        await setDoc(doc(db, "config", "main"), data);
        alert("✅ Data Saved Successfully! Your main website is updated.");
    } catch(e) {
        alert("Error saving data: " + e.message);
    }
    
    btn.innerText = "SAVE CHANGES";
}

// Initialize
window.onload = loadData;
</script>
</head>
<body>

<div class="admin-container">
    <h2>⚙️ Admin Control Panel</h2>

    <div class="stats-box">
        Total Website Clicks: <span id="totalClicks">0</span>
    </div>

    <div class="form-group">
        <label>Telegram Channel Link</label>
        <input type="text" id="telegramLink" placeholder="https://t.me/your_channel">
    </div>

    <div class="form-group">
        <label>Telegram Redirect Ratio (Click Rate)</label>
        <input type="number" id="tgRate" placeholder="3">
        <span class="hint">Example: '3' means every 3rd click goes to Telegram, rest go to WhatsApp.</span>
    </div>

    <div class="form-group">
        <label>WhatsApp Numbers (One per line)</label>
        <textarea id="whatsappNumbers" placeholder="13613616261&#10;13802931053&#10;14053857260"></textarea>
        <span class="hint">Do not use commas. Press Enter for a new number. Put Country code without '+'.</span>
    </div>

    <div class="form-group">
        <label>WhatsApp Pre-filled Message</label>
        <input type="text" id="whatsappMessage" placeholder="Hello, I would like more info...">
    </div>

    <button id="saveBtn" class="btn" onclick="saveData()">SAVE CHANGES</button>
</div>

</body>
</html>
